<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Globetrotters">
  <!-- The home-screen icon (Q-24). Drawn rather than exported: an SVG is a text
       file the repo can hold with no build step and no binary asset, and Chrome
       on Android takes it as an installable icon at any size.

       The two colors are the shell's own: navy behind, paper in front, the
       values `public/css/app.css` sets on its two tokens (DESIGN.md §11). -->
  <rect width="512" height="512" rx="96" fill="#0F1C2E"/>
  <g fill="none" stroke="#F2EFE4" stroke-width="24" stroke-linecap="round">
    <circle cx="256" cy="256" r="150"/>
    <ellipse cx="256" cy="256" rx="68" ry="150"/>
    <path d="M117 200h278M117 312h278"/>
  </g>
</svg>
