<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globetrotters</title>
<meta name="description" content="One country a month, ten minutes a day.">
<meta name="theme-color" content="#0F1C2E">
<meta name="robots" content="noindex">
<!-- Installed from Chrome's Install app, this is the whole app: no browser
     chrome, no address bar, and therefore no way to reach a page the shell does
     not render. The manifest is what makes the install offer appear and what
     decides how it launches; /js/sw-register.js is what makes it open with no
     signal. Every device in this family is Android, so there are no apple-*
     fallbacks here (DESIGN.md §2). -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- The whole app is this one document. Every screen is rendered into <main>
     by /js/app.js; the header is the only persistent chrome, and it carries
     three links: the wordmark, which is the way back to This week, the
     passport, which is the family screen, and settings. The person switcher
     lives inside settings because it is not a daily control (DESIGN.md §2). -->
<a class="skip" href="#main">Skip to content</a>

<header id="chrome" hidden>
  <!-- The wordmark is the way back. Every screen but This week is a leaf — the
       passport, settings, setup, a plan — and the only other route home was the
       browser's own back button, which an installed app does not show. -->
  <a class="wordmark" href="/" data-route>Globetrotters</a>
  <nav class="chrome-nav">
    <a class="chrome-link" href="/passport" data-route>Passport</a>
    <a class="chrome-link" href="/settings" data-route aria-label="Settings">Settings</a>
  </nav>
</header>

<main id="main" tabindex="-1">
  <!-- Rendered by the shell as soon as /api/me answers. Anyone who gets this
       far without JavaScript sees the reason rather than a blank navy page. -->
  <noscript>
    <section class="panel">
      <h1>Globetrotters</h1>
      <p>This app needs JavaScript switched on.</p>
    </section>
  </noscript>
</main>

<!-- One live region for the whole app: every screen announces through it, so a
     screen reader is told what happened without each view inventing its own. -->
<p id="status" class="status" role="status" aria-live="polite"></p>

<script type="module" src="/js/app.js"></script>
<script src="/js/sw-register.js"></script>
</body>
</html>
