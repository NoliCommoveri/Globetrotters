<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Globetrotters</title>
<meta name="description" content="One country a month, ten minutes a day.">
<meta name="theme-color" content="#0F1C2E">
<meta name="robots" content="noindex">
<!-- Added to a home screen, this is the whole app: no browser chrome, no
     address bar, and therefore no way to reach a page the shell does not
     render. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Globetrotters">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- The whole app is this one document. Every screen is rendered into <main>
     by /js/app.js; the header is the only persistent chrome, and it carries a
     settings link and nothing else. The person switcher lives inside settings
     because it is not a daily control (DESIGN.md §2). -->
<a class="skip" href="#main">Skip to content</a>

<header id="chrome" hidden>
  <span class="wordmark">Globetrotters</span>
  <a class="chrome-link" href="/settings" data-route aria-label="Settings">Settings</a>
</header>

<main id="main" tabindex="-1">
  <!-- Rendered by the shell as soon as /api/me answers. Anyone who gets this
       far without JavaScript sees the reason rather than a blank navy page. -->
  <noscript>
    <section class="panel">
      <h1>Globetrotters</h1>
      <p>This app needs JavaScript switched on.</p>
    </section>
  </noscript>
</main>

<!-- One live region for the whole app: every screen announces through it, so a
     screen reader is told what happened without each view inventing its own. -->
<p id="status" class="status" role="status" aria-live="polite"></p>

<script type="module" src="/js/app.js"></script>
</body>
</html>
