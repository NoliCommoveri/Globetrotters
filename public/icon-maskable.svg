<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Globetrotters">
  <!-- The same mark, inside the maskable safe zone: Android crops this to
       whatever shape the launcher uses, so nothing may sit outside the circle
       of radius 205 at the center. The globe is drawn at r=120 to leave room
       for the crop, and the navy runs edge to edge. -->
  <rect width="512" height="512" fill="#0F1C2E"/>
  <g fill="none" stroke="#F2EFE4" stroke-width="20" stroke-linecap="round">
    <circle cx="256" cy="256" r="120"/>
    <ellipse cx="256" cy="256" rx="54" ry="120"/>
    <path d="M145 211h222M145 301h222"/>
  </g>
</svg>
